---
name: Internal - Common Continuous Integration tasks

on:
  workflow_call:

permissions: {}

jobs:
  lint:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@33462c06bcbbd9144d7f661929e61953604b444d # 4.3.2
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write
    with:
      comment: false
      action-files: ./.github/workflows/*.yml
      # Feature READMEs are generated by devcontainers/action, which owns their formatting.
      linter-env: |
        FILTER_REGEX_EXCLUDE=(^|/)src/[^/]+/README\.md$

  validate:
    name: Validate feature metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1.4.4
        with:
          validate-only: "true"
          base-path-to-features: ./src

  test:
    needs: validate
    uses: $/.github/workflows/__test-features.yml
    permissions:
      contents: read

  reports:
    needs: [lint, validate, test]
    if: always()
    uses: hoverkraft-tech/ci-github-common/.github/workflows/ci-reports.yml@33462c06bcbbd9144d7f661929e61953604b444d # 4.3.2
    permissions:
      contents: read
      pull-requests: write
    with:
      job-results: ${{ toJSON(needs) }}
