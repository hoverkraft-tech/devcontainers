---
name: Internal - Test Features

on:
  workflow_call:

permissions: {}

jobs:
  test-autogenerated:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        features:
          - asdf
        baseImage:
          - debian:latest
          - ubuntu:latest
          - mcr.microsoft.com/devcontainers/base:ubuntu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hoverkraft-tech/ci-github-nodejs/actions/setup-node@98d91b1cc347efc64cd5fb20bc0ebc076acad114 # 3.1.0

      - name: Test default feature options
        env:
          FEATURE: ${{ matrix.features }}
          BASE_IMAGE: ${{ matrix.baseImage }}
        run: npx --no-install devcontainer features test --skip-scenarios -f "$FEATURE" -i "$BASE_IMAGE" --project-folder .

  test-scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        features:
          - asdf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hoverkraft-tech/ci-github-nodejs/actions/setup-node@98d91b1cc347efc64cd5fb20bc0ebc076acad114 # 3.1.0

      - name: Test feature scenarios
        env:
          FEATURE: ${{ matrix.features }}
        run: npx --no-install devcontainer features test -f "$FEATURE" --skip-autogenerated --skip-duplicated --project-folder .
