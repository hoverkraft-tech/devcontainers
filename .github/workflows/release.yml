---
name: Release dev container features

on:
  workflow_dispatch:
  schedule:
    - cron: "25 8 * * 1"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan-release:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should-release: ${{ steps.plan.outputs.should-release }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - id: plan
        uses: hoverkraft-tech/ci-github-publish/actions/release/plan@79515002f850e714d4c76f07983e6eb1ba97bea5 # 3.1.1
        with:
          target-ref: ${{ github.sha }}
          github-token: ${{ github.token }}

  ci:
    needs: plan-release
    if: needs.plan-release.outputs.should-release == 'true'
    uses: $/.github/workflows/__shared-ci.yml
    permissions:
      actions: read
      contents: read
      id-token: write
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write

  draft-release:
    needs: [plan-release, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - id: release
        uses: hoverkraft-tech/ci-github-publish/actions/release/create@79515002f850e714d4c76f07983e6eb1ba97bea5 # 3.1.1
        with:
          tag: ${{ needs.plan-release.outputs.tag }}
          target-ref: ${{ github.sha }}
          publish: "false"
          github-token: ${{ github.token }}

  publish-features:
    needs: draft-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: "Publish Features"
        uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1.4.4
        with:
          publish-features: "true"
          base-path-to-features: "./src"
        env:
          GITHUB_TOKEN: ${{ github.token }}

  cleanup-draft-release:
    needs: [draft-release, publish-features]
    if: ${{ failure() && needs.draft-release.result == 'success' && needs.publish-features.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: hoverkraft-tech/ci-github-publish/actions/release/delete@79515002f850e714d4c76f07983e6eb1ba97bea5 # 3.1.1
        with:
          tag: ${{ needs.draft-release.outputs.tag }}
          draft-only: "true"
          github-token: ${{ github.token }}

  publish-release:
    needs: [draft-release, publish-features]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: hoverkraft-tech/ci-github-publish/actions/release/update@79515002f850e714d4c76f07983e6eb1ba97bea5 # 3.1.1
        with:
          tag: ${{ needs.draft-release.outputs.tag }}
          publish: "true"
          github-token: ${{ github.token }}
