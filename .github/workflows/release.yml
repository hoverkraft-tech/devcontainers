---
name: Release dev container features

on:
  workflow_dispatch:
  schedule:
    - cron: "25 8 * * 1"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      should-release: ${{ steps.plan.outputs.should-release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: plan
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { readdir, readFile } = require('node:fs/promises');
            const { join } = require('node:path');
            const root = process.env.GITHUB_WORKSPACE;
            const { FeatureReleasePlanner } = await import(
              join(root, '.github/scripts/feature-release-planner.mjs')
            );
            const entries = await readdir(join(root, 'src'), { withFileTypes: true });
            const features = await Promise.all(entries.filter(entry => entry.isDirectory()).map(
              async entry => JSON.parse(await readFile(
                join(root, 'src', entry.name, 'devcontainer-feature.json'), 'utf8'
              ))
            ));
            const planner = new FeatureReleasePlanner(github, context.repo);
            const releases = await planner.plan(features);
            core.setOutput('should-release', releases.length > 0);
            core.info(releases.length
              ? `Unpublished feature versions: ${releases.map(release => release.tag).join(', ')}`
              : 'All declared feature versions have already been published.');

  ci:
    needs: plan
    if: needs.plan.outputs.should-release == 'true'
    uses: $/.github/workflows/__shared-ci.yml
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hoverkraft-tech/ci-github-nodejs/actions/setup-node@98d91b1cc347efc64cd5fb20bc0ebc076acad114 # 3.1.0

      - name: "Publish Features"
        uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1.4.4
        with:
          publish-features: "true"
          base-path-to-features: "./src"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Generate feature documentation
        run: make docs

      - id: generate-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.CI_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }} # zizmor: ignore[secrets-outside-env] documentation updates use the CI bot
          permission-contents: write
          permission-pull-requests: write

      - name: Update feature documentation
        uses: hoverkraft-tech/ci-github-common/actions/create-and-merge-pull-request@33462c06bcbbd9144d7f661929e61953604b444d # 4.3.2
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          branch: docs/devcontainer-features
          title: "docs: update feature documentation"
          body: Update generated dev container feature documentation.
          commit-message: "docs: update feature documentation"
          add-paths: src/*/README.md
