---
name: Internal - Pull request - Continuous Integration

on:
  merge_group:
  pull_request:
    branches: [main]

permissions: {}

# Shared CI entry points cancel superseded runs on the same ref.
# jscpd:ignore-start
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# jscpd:ignore-end

jobs:
  ci:
    uses: $/.github/workflows/__shared-ci.yml
    # Shared CI callers need the same permissions.
    # jscpd:ignore-start
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write
    # jscpd:ignore-end
